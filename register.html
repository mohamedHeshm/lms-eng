<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>إنشاء حساب | المأمون التعليمية</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/design-system.css"><style>.auth-page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.auth-aside{background:#1e5b4f;color:#fff;padding:clamp(34px,7vw,90px);display:grid;align-content:center}.auth-aside .brand-mark{background:#fff;color:var(--primary)}.auth-aside p{color:#d9e8e2;max-width:420px}.auth-main{display:grid;align-content:center;justify-content:center;padding:30px}.auth-card{width:min(100%,410px)}.auth-card h1{font-size:2rem;margin-bottom:6px}.auth-card>p{color:var(--muted);margin-bottom:26px}@media(max-width:720px){.auth-page{grid-template-columns:1fr}.auth-aside{display:none}}</style></head>
<body><main class="auth-page"><aside class="auth-aside"><a class="brand" href="dashboard-home.html"><span class="brand-mark">م</span>المأمون التعليمية</a><h2>ابدأ منظّمًا من أول درس.</h2><p>أنشئ حسابك للوصول للكورسات والحصص المباشرة والاختبارات وطلبات الدفع.</p></aside><section class="auth-main"><form class="auth-card" data-register-form><a class="button button-text" href="dashboard-home.html">← العودة للرئيسية</a><h1>إنشاء حساب جديد</h1><p>سجّل بياناتك، ثم ادخل مباشرة إلى حسابك.</p><label class="field">الاسم الكامل<input name="full_name" required autocomplete="name"></label><label class="field">البريد الإلكتروني<input name="email" type="email" required autocomplete="email"></label><label class="field">كلمة المرور<input name="password" type="password" minlength="6" required autocomplete="new-password"></label><label class="field">المرحلة الدراسية<select name="stage"><option value="">اختر المرحلة (اختياري)</option><option>الأولى الثانوية</option><option>الثانية الثانوية</option><option>الثالثة الثانوية</option></select></label><button class="button button-primary" type="submit">إنشاء الحساب</button><p class="course-meta" style="margin-top:15px">لديك حساب بالفعل؟ <a href="index.html" style="color:var(--primary);font-weight:700">تسجيل الدخول</a></p><div class="status-message" data-register-status role="status"></div></form></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';const s=createClient('https://dfxkuppxywldxsbyzfzo.supabase.co','sb_publishable_B3xVoCtEJtpStm76kM5KDw_WZgPsJXN');const f=document.querySelector('[data-register-form]'),n=document.querySelector('[data-register-status]');const show=(m,t)=>{n.textContent=m;n.className=`status-message is-visible ${t}`};f.addEventListener('submit',async e=>{e.preventDefault();const b=f.querySelector('button');b.disabled=true;const v=Object.fromEntries(new FormData(f).entries());const{data:existing,error:lookupError}=await s.from('users').select('id').eq('email',v.email).maybeSingle();if(lookupError){b.disabled=false;show('تعذر إنشاء الحساب. حاول مرة أخرى.','error');return}if(existing){b.disabled=false;show('هذا البريد مسجل بالفعل. استخدم تسجيل الدخول.','error');return}const{data:user,error}=await s.from('users').insert({name:v.full_name,email:v.email,password:v.password,role:'student',stage:v.stage||null,is_active:true}).select().single();b.disabled=false;if(error||!user){show('تعذر إنشاء الحساب. حاول مرة أخرى.','error');return}localStorage.setItem('currentUser',JSON.stringify(user));show('تم إنشاء الحساب بنجاح. جارٍ فتح حسابك…','success');setTimeout(()=>location.href='student-modern.html',500)});</script></body></html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>تغيير كلمة المرور | المأمون التعليمية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/design-system.css">
<style>
.pw-page{min-height:100vh;display:grid;place-items:center;padding:30px}
.pw-card{width:min(100%,420px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:34px;box-shadow:var(--shadow)}
.pw-card h1{font-size:1.5rem;margin-bottom:6px}
.pw-card>p{color:var(--muted);margin-bottom:24px}
</style>
</head>
<body>
<main class="pw-page">
  <form class="pw-card" data-password-form>
    <a class="button button-text" href="javascript:history.back()" style="padding:0;margin-bottom:14px;display:inline-block">← رجوع</a>
    <h1>🔐 تغيير كلمة المرور</h1>
    <p>حدّث كلمة المرور الخاصة بحسابك بأمان.</p>
    <label class="field">كلمة المرور الجديدة<input type="password" name="new_password" minlength="6" required autocomplete="new-password"></label>
    <label class="field">تأكيد كلمة المرور الجديدة<input type="password" name="confirm_password" minlength="6" required autocomplete="new-password"></label>
    <button class="button button-primary" type="submit" style="width:100%">تحديث كلمة المرور</button>
    <div class="status-message" data-password-status role="status"></div>
  </form>
</main>
<script type="module">
  import { supabase } from './js/supabase-client.js';
  import { requireAuth } from './js/auth-guard.js';

  const session = await requireAuth();
  if (!session) throw new Error('redirecting');

  const form = document.querySelector('[data-password-form]');
  const status = document.querySelector('[data-password-status]');
  const show = (m, t) => { status.textContent = m; status.className = `status-message is-visible ${t}`; };

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const { new_password, confirm_password } = Object.fromEntries(new FormData(form).entries());
    if (new_password !== confirm_password) { show('كلمتا المرور غير متطابقتين.', 'error'); return; }
    if (new_password.length < 6) { show('كلمة المرور يجب أن تكون 6 أحرف على الأقل.', 'error'); return; }

    const submit = form.querySelector('button');
    submit.disabled = true;
    show('جارٍ التحديث…', '');

    const { error } = await supabase.auth.updateUser({ password: new_password });
    submit.disabled = false;
    if (error) { show('تعذر تحديث كلمة المرور. حاول مرة أخرى.', 'error'); return; }

    show('تم تحديث كلمة المرور بنجاح.', 'success');
    form.reset();
    setTimeout(() => {
      const home = { admin: 'admin.html', teacher: 'teacher.html', student: 'student-modern.html' }[session.profile.role] || 'index.html';
      location.href = home;
    }, 1400);
  });
</script>
</body>
</html>

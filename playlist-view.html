<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دروس الكورس | المأمون التعليمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    body { background: var(--bg); }
    .lessons-page { max-width: 1100px; margin: 0 auto; padding: 30px 20px 60px; }
    .lessons-layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; }
    @media (max-width: 800px) { .lessons-layout { grid-template-columns: 1fr; } }
    .lesson-nav { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; position: sticky; top: 20px; }
    .lesson-nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; }
    .lesson-nav-item[data-locked="true"] { cursor: not-allowed; opacity: .5; }
    .lesson-nav-item[data-current="true"] { background: var(--bg); font-weight: 700; }
    .lesson-nav-item .badge { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--border); font-size: 13px; }
    .lesson-nav-item[data-done="true"] .badge { background: var(--success, #1f9d55); color: #fff; }
    .lesson-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
    .lesson-item h3 { margin-bottom: 12px; }
    .lesson-item iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 12px; }
    .sheet-box { margin-top: 16px; padding: 16px; border: 1px dashed var(--border); border-radius: 12px; background: var(--bg); }
  </style>
</head>
<body>
<div class="lessons-page">
  <a href="student-modern.html" class="button button-secondary" style="margin-bottom:20px;display:inline-flex">← الرجوع للوحتي</a>
  <h1 id="courseTitle" style="margin-bottom:6px">جارٍ التحميل…</h1>
  <p class="course-meta" style="margin-bottom:24px" id="courseSubtitle"></p>
  <div id="lessonsLayout"><p class="loading">جاري التحميل…</p></div>
</div>

<script type="module">
  import { supabase, esc } from './js/supabase-client.js';
  import { requireAuth } from './js/auth-guard.js';

  const session = await requireAuth('student');
  if (!session) throw new Error('redirecting');
  const studentId = session.user.id;

  const params = new URLSearchParams(location.search);
  const courseId = params.get('course');
  const layoutEl = document.getElementById('lessonsLayout');
  if (!courseId) { layoutEl.innerHTML = '<div class="empty-state">لم يتم تحديد كورس.</div>'; throw new Error('no course'); }

  const { data: enrollment } = await supabase.from('enrollments').select('id').eq('student_id', studentId).eq('course_id', courseId).maybeSingle();
  if (!enrollment) { layoutEl.innerHTML = '<div class="empty-state">أنت غير مشترك في هذا الكورس.</div>'; throw new Error('not enrolled'); }

  const { data: course } = await supabase.from('courses').select('*').eq('id', courseId).single();
  document.getElementById('courseTitle').textContent = course?.title || 'الكورس';
  document.getElementById('courseSubtitle').textContent = `${course?.subject || ''} · ${course?.stage || ''}`;

  function toEmbed(url) {
    if (url.includes('watch?v=')) return url.replace('watch?v=', 'embed/');
    if (url.includes('youtu.be/')) return 'https://www.youtube.com/embed/' + url.split('youtu.be/')[1].split('?')[0];
    return url;
  }
  function isImage(url) { return /\.(png|jpe?g|gif|webp)$/i.test(url); }

  const { data: lessons, error } = await supabase.from('course_lessons').select('*').eq('course_id', courseId).order('sort_order', { ascending: true });
  if (error) { layoutEl.innerHTML = '<div class="empty-state">حدث خطأ أثناء تحميل الدروس.</div>'; throw new Error('load error'); }
  if (!lessons.length) { layoutEl.innerHTML = '<div class="empty-state">لا توجد دروس مضافة بعد لهذا الكورس.</div>'; throw new Error('no lessons'); }

  const { data: progressRows } = await supabase.from('lesson_progress').select('lesson_id').eq('student_id', studentId).in('lesson_id', lessons.map((l) => l.id));
  const completedSet = new Set((progressRows || []).map((p) => p.lesson_id));

  // أول درس غير مكتمل هو الافتراضي، أو آخر درس لو كله خلص
  let currentIndex = lessons.findIndex((l) => !completedSet.has(l.id));
  if (currentIndex === -1) currentIndex = lessons.length - 1;

  layoutEl.innerHTML = `<div class="lessons-layout">
    <nav class="lesson-nav" id="lessonNav"></nav>
    <div id="lessonMain"></div>
  </div>`;
  const navEl = document.getElementById('lessonNav');
  const mainEl = document.getElementById('lessonMain');

  function isUnlocked(index) {
    if (index === 0) return true;
    return completedSet.has(lessons[index - 1].id);
  }

  function renderNav() {
    navEl.innerHTML = lessons.map((l, i) => {
      const done = completedSet.has(l.id);
      const locked = !isUnlocked(i);
      const current = i === currentIndex;
      return `<div class="lesson-nav-item" data-locked="${locked}" data-current="${current}" data-done="${done}" data-index="${i}">
        <span class="badge">${done ? '✓' : locked ? '🔒' : (i + 1)}</span>
        <span>${esc(l.title)}</span>
      </div>`;
    }).join('');
    navEl.querySelectorAll('.lesson-nav-item').forEach((el) => el.addEventListener('click', () => {
      const i = Number(el.dataset.index);
      if (!isUnlocked(i)) return;
      currentIndex = i;
      renderNav();
      renderMain();
    }));
  }

  function renderMain() {
    const lesson = lessons[currentIndex];
    const done = completedSet.has(lesson.id);
    const nextExists = currentIndex < lessons.length - 1;

    mainEl.innerHTML = `<div class="lesson-item">
      <h3>▶ ${esc(lesson.title)}</h3>
      <iframe src="${esc(toEmbed(lesson.video_url))}" allowfullscreen></iframe>
      <div style="margin-top:14px">
        ${done ? '' : `<button class="button button-primary" id="finishBtn" style="width:auto;padding:10px 20px">أنهيت مشاهدة الفيديو ✅</button>`}
      </div>
      ${done ? renderSheetAndNext(lesson, nextExists) : ''}
    </div>`;

    document.getElementById('finishBtn')?.addEventListener('click', async () => {
      const btn = document.getElementById('finishBtn');
      btn.disabled = true;
      const { error } = await supabase.from('lesson_progress').upsert(
        { student_id: studentId, lesson_id: lesson.id },
        { onConflict: 'student_id,lesson_id' }
      );
      if (error) { btn.disabled = false; alert('تعذر حفظ تقدمك، حاول مرة أخرى.'); return; }
      completedSet.add(lesson.id);
      renderNav();
      renderMain();
    });

    mainEl.querySelector('[data-next-lesson]')?.addEventListener('click', () => {
      currentIndex += 1;
      renderNav();
      renderMain();
    });
  }

  function renderSheetAndNext(lesson, nextExists) {
    const sheetHtml = lesson.sheet_url ? `<div class="sheet-box">
        <h4 style="margin-bottom:10px">📄 شيت الدرس — حلّه الأول</h4>
        ${isImage(lesson.sheet_url) ? `<img src="${esc(lesson.sheet_url)}" alt="شيت الدرس" style="max-width:100%;border-radius:10px;margin-bottom:10px">` : ''}
        <a class="button button-secondary" href="${esc(lesson.sheet_url)}" target="_blank" style="width:auto;display:inline-flex;padding:9px 16px">فتح / تحميل الشيت</a>
      </div>` : '';
    const nextHtml = nextExists
      ? `<div style="margin-top:16px"><button class="button button-primary" data-next-lesson style="width:auto;padding:10px 20px">الدرس التالي ▶</button></div>`
      : `<p class="course-meta" style="margin-top:16px">🎉 خلصت كل دروس الكورس.</p>`;
    return sheetHtml + nextHtml;
  }

  renderNav();
  renderMain();
</script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دروس الكورس | المأمون التعليمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/lms-extra.css">
  <style>
    body { background: var(--bg, #f7f8f6); }
    .pv-shell { max-width: 1160px; margin: 0 auto; padding: 22px 20px 60px; }
    .pv-topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .pv-back { display: inline-flex; align-items: center; gap: 6px; color: var(--lms-primary); font-weight: 700; font-size: .88rem; }
    .pv-title { margin: 4px 0 2px; }
    .pv-course-progress { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .pv-course-progress .lp-bar { max-width: 260px; }
    .pv-layout { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 22px; align-items: start; }
    .pv-player-wrap { background: #0d1a16; border-radius: var(--radius, 16px); overflow: hidden; aspect-ratio: 16/9; position: relative; }
    .pv-player-wrap iframe, .pv-player-wrap video { width: 100%; height: 100%; border: 0; display: block; }
    .pv-current-lesson { margin-top: 14px; padding: 16px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius, 16px); }
    .pv-lessons-panel { background: #fff; border: 1px solid var(--border); border-radius: var(--radius, 16px); overflow: hidden; }
    .pv-lessons-panel h3 { margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: .95rem; }
    .pv-lesson-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 16px; border: 0; background: #fff; border-bottom: 1px solid var(--border); text-align: right; cursor: pointer; font-family: inherit; }
    .pv-lesson-item:last-child { border-bottom: 0; }
    .pv-lesson-item:hover { background: #f6faf7; }
    .pv-lesson-item.active { background: var(--lms-light); }
    .pv-lesson-num { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .76rem; font-weight: 800; background: #eef2ef; color: var(--muted); }
    .pv-lesson-item.done .pv-lesson-num { background: var(--lms-success); color: #fff; }
    .pv-lesson-item.active .pv-lesson-num { background: var(--lms-primary); color: #fff; }
    .pv-lesson-info { flex: 1; min-width: 0; }
    .pv-lesson-info strong { display: block; font-size: .86rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pv-lesson-info small { color: var(--muted); font-size: .74rem; }
    @media (max-width: 900px) { .pv-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="pv-shell">
  <div class="pv-topbar">
    <a class="pv-back" href="student-modern.html">→ العودة للوحة الطالب</a>
  </div>

  <div data-course-header>
    <h1 class="pv-title" data-course-title>جاري التحميل…</h1>
    <p class="course-meta" data-course-subtitle></p>
    <div class="pv-course-progress">
      <div class="lp-bar" style="flex:1"><span data-course-progress-fill style="width:0%"></span></div>
      <span data-course-progress-text style="font-size:.82rem;font-weight:700;color:var(--lms-primary)">0%</span>
    </div>
  </div>

  <div class="pv-layout" style="margin-top:20px">
    <div>
      <div class="pv-player-wrap" data-player-wrap>
        <div style="color:#fff;display:flex;align-items:center;justify-content:center;height:100%;">جاري تحميل الدرس…</div>
      </div>
      <div class="pv-current-lesson">
        <h3 data-lesson-title style="margin:0 0 8px">—</h3>
        <div class="lp-meta-row">
          <span>نسبة مشاهدتك لهذا الدرس: <strong data-lesson-pct>0%</strong></span>
          <span data-lesson-status></span>
        </div>
        <div class="lp-bar"><span data-lesson-bar-fill style="width:0%"></span></div>
        <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap" data-lesson-files></div>
      </div>
    </div>
    <aside class="pv-lessons-panel">
      <h3>دروس الكورس</h3>
      <div data-lessons-list><p class="loading">جاري التحميل…</p></div>
    </aside>
  </div>
</div>

<script type="module" src="js/playlist-view.js"></script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="تصفح كورسات المأمون التعليمية." />
    <title>الكورسات | المأمون التعليمية</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="css/design-system.css" />
    <link rel="stylesheet" href="css/courses.css" />
</head>

<body class="courses-page">

<!-- ==================== NAVBAR ==================== -->
<header class="site-header" data-courses-navbar>
    <nav class="container nav" aria-label="التنقل الرئيسي">
        <!-- Brand -->
        <a class="brand" href="dashboard-home.html">
            <img src="images/logo.jpeg" class="brand-image" alt="شعار المأمون التعليمية" />
            <span>المأمون التعليمية</span>
        </a>

        <!-- Navigation Links -->
        <div class="nav-links">
            <a href="dashboard-home.html">الرئيسية</a>
            <a aria-current="page" href="courses.html">الكورسات</a>
        </div>

        <!-- Actions -->
        <div class="nav-actions">
            <a class="button button-secondary" href="index.html">تسجيل الدخول</a>
        </div>
    </nav>
</header>

<!-- ==================== MAIN ==================== -->
<main>
    <div class="container">

        <!-- ===== HERO ===== -->
        <section class="cp-hero">
            <div class="cp-hero-bg"></div>
            <div class="cp-hero-content">
                <span class="cp-badge">🛒 متجر الكورسات</span>
                <h1>اختر الكورس المناسب لك</h1>
                <p>استخدم البحث والتصفية للوصول إلى محتوى رحلتك الدراسية.</p>
            </div>
        </section>

        <!-- ===== SEARCH BAR ===== -->
        <div class="cp-search-bar">
            <div class="cp-search-wrap">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input
                        type="search"
                        name="search"
                        placeholder="ابحث باسم الكورس..."
                        form="cp-filters-form"
                        aria-label="ابحث عن كورس"
                />
            </div>
            <div class="cp-results-count" data-courses-count>
                عرض <strong>0</strong> من <strong>0</strong> كورس
            </div>
            <button class="cp-mobile-filter-btn" data-mobile-filter-toggle>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="21" x2="4" y2="14" />
                    <line x1="4" y1="10" x2="4" y2="3" />
                    <line x1="12" y1="21" x2="12" y2="12" />
                    <line x1="12" y1="8" x2="12" y2="3" />
                    <line x1="20" y1="21" x2="20" y2="16" />
                    <line x1="20" y1="12" x2="20" y2="3" />
                    <line x1="1" y1="14" x2="7" y2="14" />
                    <line x1="9" y1="8" x2="15" y2="8" />
                    <line x1="17" y1="16" x2="23" y2="16" />
                </svg>
                الفلاتر
            </button>
        </div>

        <!-- ===== LAYOUT: Filters + Grid ===== -->
        <div class="cp-layout">

            <!-- ===== FILTERS SIDEBAR ===== -->
            <aside class="cp-filters" role="complementary" aria-label="تصفية الكورسات">
                <form id="cp-filters-form" data-course-filters>

                    <div class="cp-filters-title">
                        <h3>📋 تصفية الكورسات</h3>
                        <button type="button" class="cp-clear-all" data-clear-filters>مسح الكل</button>
                    </div>

                    <!-- المرحلة الدراسية -->
                    <label class="field">
                        المرحلة الدراسية
                        <select name="stage">
                            <option value="">كل المراحل</option>
                            <option value="الأولى الثانوية">الأولى الثانوية</option>
                            <option value="الثانية الثانوية">الثانية الثانوية</option>
                            <option value="الثالثة الثانوية">الثالثة الثانوية</option>
                        </select>
                    </label>

                    <!-- المادة -->
                    <label class="field">
                        المادة
                        <select name="subject">
                            <option value="">كل المواد</option>
                            <!-- سيتم ملؤها من قاعدة البيانات عبر JavaScript -->
                        </select>
                    </label>

                    <!-- السعر (مرشح وهمي للواجهة — غير مستخدم في الاستعلام الفعلي) -->
                    <label class="field">
                        السعر
                        <select name="price_filter">
                            <option value="">كل الأسعار</option>
                            <option value="free">مجاني</option>
                            <option value="paid">مدفوع</option>
                        </select>
                    </label>

                    <button class="cp-apply-btn" type="submit">تطبيق الفلاتر</button>
                </form>
            </aside>

            <!-- ===== COURSE GRID ===== -->
            <section class="cp-grid" aria-label="قائمة الكورسات">
                <!-- Grid Header -->
                <div class="cp-grid-header">
                    <h2>📚 الكورسات المتاحة</h2>
                    <div class="cp-sort-wrap">
                        <label for="cp-sort-select">ترتيب حسب</label>
                        <select id="cp-sort-select" data-sort-courses>
                            <option value="newest">الأحدث</option>
                            <option value="rating">الأعلى تقييمًا</option>
                            <option value="price_low">السعر من الأقل للأعلى</option>
                            <option value="price_high">السعر من الأعلى للأقل</option>
                        </select>
                    </div>
                </div>

                <!-- Course Grid -->
                <div class="course-grid" data-course-list>
                    <!-- سيتم ملؤها بواسطة store.js -->
                </div>
            </section>

        </div>
    </div>
</main>

<!-- ==================== MOBILE FILTER DRAWER ==================== -->
<div class="cp-filter-backdrop" data-mobile-backdrop></div>
<aside class="cp-filter-drawer" data-mobile-drawer role="dialog" aria-label="قائمة الفلاتر">
    <div class="cp-drawer-head">
        <h3>📋 تصفية الكورسات</h3>
        <button class="cp-drawer-close" data-mobile-close aria-label="إغلاق الفلاتر">✕</button>
    </div>

    <form data-mobile-filters-form>
        <label class="field">
            المرحلة الدراسية
            <select name="stage">
                <option value="">كل المراحل</option>
                <option value="الأولى الثانوية">الأولى الثانوية</option>
                <option value="الثانية الثانوية">الثانية الثانوية</option>
                <option value="الثالثة الثانوية">الثالثة الثانوية</option>
            </select>
        </label>

        <label class="field">
            المادة
            <select name="subject">
                <option value="">كل المواد</option>
            </select>
        </label>

        <label class="field">
            السعر
            <select name="price_filter">
                <option value="">كل الأسعار</option>
                <option value="free">مجاني</option>
                <option value="paid">مدفوع</option>
            </select>
        </label>

        <div class="cp-drawer-actions">
            <button class="cp-apply-btn" type="submit">تطبيق الفلاتر</button>
            <button class="cp-clear-btn" type="button" data-mobile-clear>مسح الكل</button>
        </div>
    </form>
</aside>

<!-- ==================== FOOTER ==================== -->
<footer class="footer">
    <div class="container footer-row">
        <span>المأمون التعليمية</span>
        <a href="dashboard-home.html">العودة للرئيسية</a>
    </div>
</footer>

<!-- ==================== SCRIPTS ==================== -->
<script type="module" src="js/store.js"></script>

</body>
</html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اختبار | المأمون</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/design-system.css"></head><body><main class="container" style="padding:50px 0"><a class="button button-text" href="student-modern.html">← لوحة الطالب</a><div class="panel" data-quiz>جاري تحميل الاختبار…</div></main><script type="module">import{supabase,sessionProfile,message,escapeHtml}from'./js/client.js';const box=document.querySelector('[data-quiz]'),id=new URLSearchParams(location.search).get('id');const p=await sessionProfile();if(!p){location.href='index.html'}else{const{data:q,error}=await supabase.from('quizzes').select('*,quiz_questions(*)').eq('id',id).single();if(error){box.textContent=message}else{const question=q.quiz_questions?.[0];box.innerHTML=question?`<h1>${escapeHtml(q.title)}</h1><h3>${escapeHtml(question.question)}</h3><form>${question.options.map((o,i)=>`<label class="payment-method"><input type="radio" name="answer" value="${i}"><strong>${escapeHtml(o)}</strong></label>`).join('')}<button class="button button-primary" style="margin-top:15px">إرسال الإجابة</button></form><div class="status-message" data-s></div>`:'لا توجد أسئلة.';box.querySelector('form')?.addEventListener('submit',async e=>{e.preventDefault();const answer=new FormData(e.currentTarget).get('answer');if(answer===null)return;const{error}=await supabase.from('quiz_attempts').insert({quiz_id:q.id,student_id:p.id,answers:{[question.id]:Number(answer)},score:Number(answer)===question.correct_option?100:0,submitted_at:new Date().toISOString()});const s=box.querySelector('[data-s]');s.className='status-message is-visible '+(error?'error':'success');s.textContent=error?message:(Number(answer)===question.correct_option?'إجابة صحيحة!':'تم إرسال إجابتك.');});}}</script></body></html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>تسجيل الدخول | المأمون التعليمية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    .auth-page { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
    .auth-aside { background: #1e5b4f; color: #fff; padding: clamp(34px, 7vw, 90px); display: grid; align-content: center; }
    .auth-aside .brand-mark { background: #fff; color: var(--primary); }
    .auth-aside p { max-width: 420px; color: #d9e8e2; }
    .auth-main { display: grid; align-content: center; justify-content: center; padding: 30px; }
    .auth-card { width: min(100%, 410px); }
    .auth-card h1 { font-size: 2rem; margin-bottom: 6px; }
    .auth-card > p { color: var(--muted); margin-bottom: 26px; }
    @media (max-width: 720px) { .auth-page { grid-template-columns: 1fr; } .auth-aside { display: none; } }
  </style>
</head>
<body>
  <main class="auth-page">
    <aside class="auth-aside"><a class="brand" href="dashboard-home.html"><span class="brand-mark">م</span>المأمون التعليمية</a><h2>كل دروسك وخطواتك في مكان واحد.</h2><p>سجّل الدخول لمتابعة الكورسات، الواجبات، والإشعارات الخاصة بحسابك.</p></aside>
    <section class="auth-main"><form class="auth-card" data-login-form><a class="button button-text" href="dashboard-home.html">← العودة للرئيسية</a><h1>أهلًا بعودتك</h1><p>أدخل بيانات حسابك للمتابعة.</p><label class="field">البريد الإلكتروني<input name="email" type="email" autocomplete="email" required></label><label class="field">كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><button class="button button-primary" type="submit">تسجيل الدخول</button><div class="status-message" data-login-status role="status"></div></form></section>
  </main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    const supabase = createClient('https://dfxkuppxywldxsbyzfzo.supabase.co', 'sb_publishable_B3xVoCtEJtpStm76kM5KDw_WZgPsJXN');
    const form = document.querySelector('[data-login-form]'); const status = document.querySelector('[data-login-status]');
    const show = (message, type) => { status.textContent = message; status.className = `status-message is-visible ${type}`; };
    form.addEventListener('submit', async (event) => {
      event.preventDefault(); const submit = form.querySelector('button'); submit.disabled = true; show('جارٍ تسجيل الدخول…', '');
      const values = Object.fromEntries(new FormData(form).entries());
      const { data, error } = await supabase.auth.signInWithPassword(values);
      if (error || !data.user) { console.error('Sign in failed', error); submit.disabled = false; show('تعذّر تسجيل الدخول. راجع بياناتك أو تواصل مع الإدارة.', 'error'); return; }
      const { data: profile, error: profileError } = await supabase.from('profiles').select('id, full_name, role').eq('id', data.user.id).single();
      if (profileError || !profile) { console.error('Profile lookup failed', profileError); await supabase.auth.signOut(); submit.disabled = false; show('الحساب غير مهيأ بعد. تواصل مع إدارة المنصة.', 'error'); return; }
      localStorage.setItem('currentUser', JSON.stringify({ id: profile.id, name: profile.full_name, role: profile.role }));
      location.href = profile.role === 'admin' ? 'admin.html' : profile.role === 'teacher' ? 'teacher.html' : 'student-modern.html';
    });
  </script>
</body>
</html>

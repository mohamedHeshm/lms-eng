<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | المأمون التعليمية</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/design-system.css"><style>.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.side{background:#1e5b4f;color:white;padding:clamp(35px,8vw,100px);display:grid;align-content:center}.side .brand-mark{background:#fff;color:#1e5b4f}.side p{color:#d8e6df;max-width:390px}.form-wrap{display:grid;place-items:center;padding:28px}.form{width:min(100%,410px)}@media(max-width:700px){.auth{grid-template-columns:1fr}.side{display:none}}</style></head><body><main class="auth"><aside class="side"><a class="brand" href="dashboard-home.html"><span class="brand-mark">م</span>المأمون التعليمية</a><h1>كل دروسك، اختباراتك، واشتراكاتك في مكان واحد.</h1><p>منصة تعليمية منظمة للطالب والمدرس والسنتر.</p></aside><section class="form-wrap"><form class="form" data-login><a class="button button-text" href="dashboard-home.html">← العودة للرئيسية</a><h1>أهلًا بعودتك</h1><p class="lead">سجّل الدخول إلى حسابك.</p><label class="field">البريد الإلكتروني<input type="email" name="email" required autocomplete="email"></label><label class="field">كلمة المرور<input type="password" name="password" required autocomplete="current-password"></label><button class="button button-primary" type="submit">تسجيل الدخول</button><p class="course-meta">ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p><div data-status class="status-message" role="status"></div></form></section></main><script type="module" src="js/auth.js"></script></body></html>
